{% extends "team/base.html" %}
{% block content %}
  <div class="team-heading">
    <a class="team-back-link" href="{% url 'team_application_detail' application.pk %}">Back to application</a>
    <h1>Delete application</h1>
  </div>
  <section class="team-panel">
    <p>Are you sure you want to delete this application?</p>
    <form method="post" class="team-action-links">
      {% csrf_token %}
      <input type="hidden" name="confirmed" value="true">
      <button class="btn btn-danger" type="submit">Confirm delete</button>
      <a class="btn btn-outline" href="{% url 'team_application_detail' application.pk %}">Go back</a>
    </form>
  </section>
{% endblock %}
